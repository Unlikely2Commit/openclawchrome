<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenClaw Relay</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 10px; width: 340px; }
      .row { margin: 8px 0; }
      label { display:block; font-size: 12px; color: #444; margin-bottom: 4px; }
      input[type=text] { width: 100%; padding: 6px; box-sizing: border-box; }
      textarea { width: 100%; height: 70px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      button { padding: 6px 10px; }
      .small { font-size: 12px; color: #555; }
      .status { font-size: 12px; padding: 6px; background: #f5f5f5; border-radius: 6px; }
      .tabs { font-size: 12px; }
      .log { font-size: 11px; max-height: 110px; overflow: auto; background: #111; color: #ddd; padding: 6px; border-radius: 6px; }
      .log div { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="status" id="status">Loading…</div>
    </div>

    <div class="row">
      <label>Relay HTTP Base URL (for pairing)</label>
      <input id="httpBase" type="text" placeholder="http://ec2-x-x-x-x.compute.amazonaws.com:8787" />
    </div>

    <div class="row">
      <button id="pairBtn">Pair</button>
      <button id="connectBtn">Connect WS</button>
      <button id="disconnectBtn">Disconnect</button>
      <div class="small" id="pairInfo"></div>
    </div>

    <hr/>

    <div class="row">
      <button id="attachBtn">Attach current tab</button>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="row">
      <label><input type="checkbox" id="allowActions"/> Allow Actions (DANGEROUS)</label>
    </div>

    <div class="row">
      <label>Domain allowlist (one per line)</label>
      <textarea id="allowlist" placeholder="example.com\napp.example.com"></textarea>
      <div class="small">Actions will only run when Allow Actions is enabled and the current tab hostname matches this allowlist.</div>
    </div>

    <div class="row">
      <label>Audit log (latest)</label>
      <div class="log" id="log"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
